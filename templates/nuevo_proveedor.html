{% extends "base.html" %}

{% block title %}
Nuevo Proveedor
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-7">

        <div class="card shadow-sm">

            <div class="card-header bg-rosa text-white">
                <h3 class="mb-0">
                    <i class="bi bi-person-plus"></i>
                    Registrar nuevo proveedor
                </h3>
            </div>

            <div class="card-body p-4">

                <form method="POST">

                    <!-- NOMBRE -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre del proveedor
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            name="nombre"
                            required
                            oninput="this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñÜü\s]/g, '')"
                            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+"
                            title="El nombre solo puede contener letras y espacios"
                        >
                    </div>


                    <!-- NIT -->
                    <div class="mb-3">
                        <label for="nit" class="form-label">
                            NIT
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nit"
                            name="nit"
                            inputmode="numeric"
                            required
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            pattern="[0-9]+"
                            title="El NIT solo puede contener números"
                        >
                    </div>


                    <!-- TELÉFONO -->
                    <div class="mb-3">
                        <label for="telefono" class="form-label">
                            Teléfono
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="telefono"
                            name="telefono"
                            inputmode="numeric"
                            required
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            pattern="[0-9]+"
                            title="El teléfono solo puede contener números"
                        >
                    </div>


                    <!-- CORREO -->
                    <div class="mb-3">
                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="correo"
                            name="correo"
                            required
                            placeholder="ejemplo@correo.com"
                        >
                    </div>


                    <!-- DIRECCIÓN -->
                    <div class="mb-3">
                        <label for="direccion" class="form-label">
                            Dirección
                        </label>

                        <textarea
                            class="form-control"
                            id="direccion"
                            name="direccion"
                            rows="3"
                            required
                        ></textarea>
                    </div>


                    <!-- ESTADO -->
                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="activo"
                            name="activo"
                            checked
                        >

                        <label
                            class="form-check-label"
                            for="activo"
                        >
                            Proveedor activo
                        </label>

                    </div>


                    <!-- BOTONES -->
                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            <i class="bi bi-save"></i>
                            Guardar proveedor
                        </button>

                        <a
                            href="{{ url_for('proveedores') }}"
                            class="btn btn-secondary"
                        >
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
