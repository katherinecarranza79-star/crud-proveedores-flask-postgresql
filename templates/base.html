<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Gestión de Proveedores{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS propio -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='estilos.css') }}"
    >
</head>

<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-rosa shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">
                <i class="bi bi-building"></i>
                Proveedores
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('inicio') }}">
                            <i class="bi bi-house"></i>
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('proveedores') }}">
                            <i class="bi bi-list-ul"></i>
                            Proveedores
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('nuevo_proveedor') }}">
                            <i class="bi bi-plus-circle"></i>
                            Nuevo proveedor
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- CONTENIDO DE CADA PÁGINA -->
    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="text-center py-4 mt-5 border-top">
        <div class="container">
            <p class="mb-0">
                CRUD de Proveedores — Desarrollo Web
            </p>
            <small>
                Universidad Mariano Gálvez
            </small>
        </div>
    </footer>


    <!-- JavaScript de Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
